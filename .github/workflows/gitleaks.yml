name: Gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**', 'hotfix/**', 'chore/**', 'bug/**']

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --report-format=json --report-path=/repo/gitleaks-results.json --no-git --exit-code=1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.json
