name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**', 'hotfix/**', 'chore/**', 'bug/**']

jobs:
  check-backend:
    name: Type-check backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run typecheck:scripts

  check-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end-2/package-lock.json

      - run: npm ci
      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3005
          NEXT_PUBLIC_GA_ID: G-PLACEHOLDER
